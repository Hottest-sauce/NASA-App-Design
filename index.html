<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hold the Fort: Mars Hab (Learning Project)</title>
<!-- LESSON 0: three files, three jobs. index.html = structure, style.css = looks, game.js = behavior. -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <div id="hud"></div>
  <div id="scene">
    <div id="roomname"></div>
    <button class="nav" id="prev" aria-label="Previous room">◀</button>
    <button class="nav" id="next" aria-label="Next room">▶</button>
    <div id="toast"></div>
    <div id="vn"><div class="who"></div><div class="txt"></div><span class="hint">click to continue ▸</span></div>
    <div id="modal"></div>
    <div id="obj"></div>
  </div>
  <p style="font-size:.8rem;opacity:.65">Prototype: everything is placeholder art. Dashed boxes are hotspots where PNG assets will go. Click one to see what mini-game lives there.</p>
</div>
<script src="game.js"></script>
</body>
</html>
